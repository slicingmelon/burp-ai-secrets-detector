plugins {
    id 'java'
}

version = '1.7.2'

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2025.11'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-toml:2.20.1'
    implementation 'com.electronwill.night-config:toml:3.8.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.0'
}

// Generate version.properties file during build
task generateVersionFile {
    doLast {
        def versionFile = file("$buildDir/resources/main/version.properties")
        versionFile.parentFile.mkdirs()
        versionFile.text = "version=${version}\n" 
    }
}

processResources {
    dependsOn generateVersionFile
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
}

test {
    useJUnitPlatform()
}